[project]
name = "better-trading-agents"
version = "0.1.0"
description = "A fast multi-agent stock research app powered by CrewAI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "crewai>=0.80",
    "pydantic>=2.7",
    "httpx>=0.27",
    "yfinance>=0.2.50",
    "python-dotenv>=1.0",
]

# Everyday commands: uv run setup / uv run app / uv run test.
[project.scripts]
setup = "scripts.setup_wizard:main"
app = "app.cli:serve"
test = "app.cli:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

# Dev-only: drives the automated browser smoke test (scripts/check_browser_smoke.py).
# It launches a system Chromium (Edge/Chrome), so no browser download is needed.
[dependency-groups]
dev = ["playwright>=1.45"]

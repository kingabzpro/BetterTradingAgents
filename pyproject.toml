[project]
name = "better-trading-agents"
version = "0.4.0"
description = "A fast multi-agent stock research app powered by the OpenAI Agents SDK."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # OpenAI Agents SDK: every agent call is a single completion against an
    # OpenAI-compatible endpoint (DeepSeek/OpenAI), so the framework is only
    # the model layer; orchestration stays hand-written asyncio.
    "openai-agents>=0.2",
    "pydantic>=2.7",
    "httpx>=0.27",
    "yfinance>=0.2.50,<1.8",
    "python-dotenv>=1.0",
    "alpaca-py>=0.44.0",
    "keyring>=25.7.0",
    "questionary>=2.1.1",
]

# Everyday commands: uv run setup / uv run app / uv run test.
[project.scripts]
setup = "scripts.setup_wizard:main"
app = "app.cli:serve"
test = "app.cli:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

# Dev-only: drives the automated browser smoke test (scripts/check_browser_smoke.py).
# It launches a system Chromium (Edge/Chrome), so no browser download is needed.
# ruff backs the CI lint step (ROADMAP P2.15).
[dependency-groups]
dev = ["playwright>=1.45", "ruff>=0.6"]

# Pinned so local and CI lint agree; deliberately narrow: pyflakes-level
# correctness (unused imports/names, syntax, real errors) without style
# churn over the existing tree.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

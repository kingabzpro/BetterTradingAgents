<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>BetterTradingAgents logo: three agent candlesticks converging into a decision arrow</title>
  <defs>
    <linearGradient id="bta-bg" x1="8" y1="8" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1c2740"/>
      <stop offset="1" stop-color="#0e1420"/>
    </linearGradient>
    <linearGradient id="bta-line" x1="22" y1="56" x2="78" y2="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="3" y="3" width="90" height="90" rx="22" fill="url(#bta-bg)" stroke="#2b3a58" stroke-width="2"/>

  <!-- candle 1: technical analyst -->
  <path d="M24 50v6M24 70v6" stroke="#4f8cff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="18.5" y="56" width="11" height="14" rx="2.5" fill="#4f8cff"/>

  <!-- candle 2: fundamental analyst -->
  <path d="M44 34v8M44 56v8" stroke="#4f8cff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="38.5" y="42" width="11" height="14" rx="2.5" fill="#4f8cff"/>

  <!-- candle 3: news analyst, breaks out green -->
  <path d="M64 16v8M64 40v8" stroke="#22c55e" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="58.5" y="24" width="11" height="16" rx="2.5" fill="#22c55e"/>

  <!-- convergence glow + line -->
  <path d="M24 54 44 40 64 22 74 13" stroke="url(#bta-line)" stroke-opacity="0.18" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 54 44 40 64 22 74 13" stroke="url(#bta-line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- agent nodes -->
  <circle cx="24" cy="54" r="3.4" fill="#101724" stroke="#c9d9ff" stroke-width="2"/>
  <circle cx="44" cy="40" r="3.4" fill="#101724" stroke="#c9d9ff" stroke-width="2"/>
  <circle cx="64" cy="22" r="3.4" fill="#101724" stroke="#b8f4cd" stroke-width="2"/>

  <!-- decision arrowhead -->
  <path d="M65.5 11.5 75 12.5 74 22" stroke="#22c55e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

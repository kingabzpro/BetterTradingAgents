name: Portable binaries

on:
  pull_request:
    paths:
      - '.github/workflows/portable-binaries.yml'
      - 'app/**'
      - 'scripts/*bundle*.py'
      - 'scripts/desktop.py'
      - 'static/**'
      - '.env.example'
      - 'LICENSE'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: portable-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.platform }} x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: Windows
            archive: bettertradingagents-windows-x64.zip
            desktop: bettertradingagents-desktop-windows-x64.zip
            desktop-deps: pywebview==6.1
          - runner: ubuntu-22.04
            platform: Linux
            archive: bettertradingagents-linux-x64.tar.gz
            desktop: bettertradingagents-desktop-linux-x64.tar.gz
            desktop-deps: pywebview[qt]==6.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Build portable archive
        run: uv run --frozen --no-dev --with pyinstaller==6.22.3 python scripts/build_bundle.py packages
      - name: Launch and test the extracted bundle
        run: uv run --no-sync python scripts/smoke_bundle.py packages/${{ matrix.archive }}
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libegl1
      - name: Build desktop archive
        run: uv run --frozen --no-dev --with pyinstaller==6.22.3 --with '${{ matrix.desktop-deps }}' python scripts/build_bundle.py packages --desktop
      - name: Test Windows desktop archive
        if: runner.os == 'Windows'
        run: uv run --no-sync python scripts/smoke_bundle.py packages/${{ matrix.desktop }}
      - name: Test Linux desktop archive
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --no-sync python scripts/smoke_bundle.py packages/${{ matrix.desktop }}
      - uses: actions/upload-artifact@v7
        with:
          path: packages/${{ matrix.archive }}
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: packages/${{ matrix.desktop }}
          archive: false
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
          skip-decompress: true
      - name: Attach binaries to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            packages/bettertradingagents-windows-x64.zip \
            packages/bettertradingagents-linux-x64.tar.gz \
            packages/bettertradingagents-desktop-windows-x64.zip \
            packages/bettertradingagents-desktop-linux-x64.tar.gz

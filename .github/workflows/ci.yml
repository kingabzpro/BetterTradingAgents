# CI gate (ROADMAP P2.15): offline checks, lint, and the import smoke on
# pull request and main push, so a broken check or an undeclared dependency
# fails before merge instead of when a developer remembers `uv run test`.
# The browser smoke is deliberately absent: it needs a system Chromium and
# flakes often enough that a red/green gate would lie.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies from the lockfile
        run: uv sync --frozen

      - name: Lint (ruff)
        if: matrix.python-version == '3.12'
        run: uv run ruff check app scripts

      - name: Offline check suite and import smoke
        run: uv run test offline

  # Supply-chain gate (ROADMAP P2.23): dependency CVE audit plus secret
  # scanning on every push and pull request, beside the ruff/offline checks.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the secret scan covers the whole log, not just
          # the pushed commits.
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Dependency CVE audit (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project > requirements.txt
          uvx pip-audit --requirement requirements.txt
